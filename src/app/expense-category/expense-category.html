<div class="relative aspect-square w-full max-w-[280px] mx-auto">
  <div class="absolute inset-0 bg-slate-50 rounded-full border-8 border-slate-100"></div>
  <canvas [id]="chartId" class="absolute inset-0 w-full h-full"></canvas>
</div>

<div class="grid grid-cols-2 gap-2 mt-6">
  <div *ngFor="let label of labels; let i = index"
       class="flex items-center gap-2 text-xs text-slate-500">
    <span class="w-3 h-3 rounded"
          [style.backgroundColor]="colors[i]"></span>
    {{ label }}
  </div>
</div>
