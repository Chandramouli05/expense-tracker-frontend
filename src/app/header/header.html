<header class="bg-[#F8FAFC] px-4 md:px-8 py-4 flex items-center justify-between gap-4">
    <div class="flex items-center gap-4">
        <button (click)="toggleSidebar()" class="lg:hidden p-2 text-slate-600 hover:bg-slate-100 rounded-lg">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
        </button>
        <h2 class="text-xl text-slate-900 hidden sm:block">
            {{period()}} <span class="font-bold">{{firstName()}} 👋</span>
        </h2>
    </div>

    <div class="flex items-center gap-3 md:gap-6 flex-1 justify-end">
        <div class="relative w-full max-w-md hidden md:block">
            <input type="text" placeholder="Search"
                class="w-full bg-white rounded-xl border-none shadow-sm px-4 py-2.5 pl-10 text-sm  focus:ring-blue-300 focus:border-none transition-all">
            <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" fill="none"
                stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
        </div>

        <button (click)="toggleNotifications()"
            class="relative p-2.5 bg-white rounded-xl shadow-sm text-slate-600 hover:text-blue-600 transition-colors">
            <span *ngIf="notificationCount > 0"
                class="absolute -top-1 -right-1 bg-red-500 text-white text-xs font-semibold rounded-full px-1.5 min-w-[18px] text-center">
                {{ notificationCount }}
            </span>
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
            </svg>
        </button>

        <div *ngIf="showNotifications"
            class="absolute right-4 mt-52 w-[90vw] max-w-sm bg-white border border-slate-200 border-shadow rounded-xl shadow-lg z-50 md:w-80 ">
            <div class="px-4 py-3 font-semibold border-b border-slate-300">
                Notifications
            </div>

            <div *ngIf="notifications.length === 0" class="px-4 py-3 text-sm text-slate-500">
                No notifications
            </div>

            <ul class="max-h-64 overflow-y-auto">
                <li *ngFor="let n of notifications; let i = index"
                    class="px-4 py-2 flex flex-end text-sm hover:bg-slate-100 cursor-pointer">
                    <span class="flex-1">
                        {{ n.message }}
                    </span>

                    <!-- Close button -->
                    <button (click)="removeNotification(i)" class="text-slate-400 hover:text-red-500 transition"
                        aria-label="Delete notification">
                        ✕
                    </button>
                </li>
            </ul>
        </div>
        <!--relative p-2.5 bg-white rounded-xl shadow-sm text-slate-600 hover:text-blue-600 transition-colors-->
        <div alt="Profile" class="relative
    flex items-center justify-center
    rounded-full
    font-semibold text-white shadow-sm
    select-none

    h-11 w-11 text-sm
    sm:h-11 sm:w-11 sm:text-base
    md:h-10 md:w-18 md:text-lg
    lg:h-11 lg:w-11 lg:text-xl
  " [ngClass]="profileBgColor()">
            {{ profileLetter() }}
        </div>

    </div>
</header>
